plugins {
    id 'java'
    id 'application'
}

// ЛР 3: откуда скачивать библиотеки
repositories {
    mavenCentral()
}

dependencies {
    // Jackson — библиотека для записи и чтения JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    // JUnit 5 — библиотека для тестов (нужна только тестам)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Запуск тестов: ./gradlew test
test {
    useJUnitPlatform()
}

// Запуск программы: ./gradlew run
application {
    mainClass = 'poi.Main'
}

// Чтобы русские буквы в коде читались правильно
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ЛР 2: замеры времени — ./gradlew benchmark
tasks.register('benchmark', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'poi.experiment.Benchmark'
}

// Чтобы русский текст в консоли не превращался в вопросики
tasks.withType(JavaExec).configureEach {
    jvmArgs '-Dstdout.encoding=UTF-8'
}

// ЛР 2: демонстрация гонки потоков — ./gradlew raceDemo
tasks.register('raceDemo', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'poi.experiment.RaceDemo'
}
